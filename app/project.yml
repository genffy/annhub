name: AnnHub
options:
  bundleIdPrefix: com.annhub
  deploymentTarget:
    # 14.4: TableColumnBuilder conditionals (hideable library columns) need it.
    macOS: "14.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.5.0"
packages:
  AnnHubCore:
    path: .
targets:
  AnnHubDesktop:
    type: application
    platform: macOS
    sources:
      - path: Desktop
    dependencies:
      - package: AnnHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annhub.desktop
        LSUIElement: "YES"
schemes:
  AnnHubDesktop:
    build:
      targets:
        AnnHubDesktop: all
