<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Long Page Fixture</title>
    <style>
      body { font-family: Georgia, serif; margin: 0; color: #1f2937; background: #ffffff; }
      header {
        position: sticky;
        top: 0;
        height: 56px;
        background: #2f6fde;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 24px;
        z-index: 5;
      }
      section { padding: 32px 24px; }
      .screen { height: 720px; }
      p { line-height: 1.7; max-width: 640px; }
      img { display: block; width: 400px; height: 220px; background: #d1d5db; }
      footer { padding: 24px; background: #f3f4f6; }
    </style>
  </head>
  <body>
    <header data-testid="sticky-nav">Sticky Navigation</header>
    <section class="screen" id="s1">
      <h1>Long page for the scrolling capture</h1>
      <p>第一屏：吸顶导航栏在页首被拍到长图里，之后的屏幕里它被隐藏，不在长图里重复。</p>
    </section>
    <section class="screen" id="s2">
      <p>第二屏：懒加载的图片滚动到眼前才开始加载，每一屏拍之前最多等一秒。</p>
      <img data-src="pixel-blue" alt="lazy one" />
    </section>
    <section class="screen" id="s3">
      <p>第三屏。</p>
      <img data-src="pixel-green" alt="lazy two" />
    </section>
    <section class="screen" id="s4"><p>第四屏。</p></section>
    <section class="screen" id="s5"><p>第五屏。</p></section>
    <footer data-testid="page-end">The end of the page.</footer>
    <script>
      // the lazy images only get their real pixels once they are scrolled near
      const colors = { 'pixel-blue': '#3b82f6', 'pixel-green': '#22c55e' }
      const observer = new IntersectionObserver(
        entries => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue
            const image = entry.target
            image.src =
              'data:image/svg+xml,' +
              encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220"><rect width="400" height="220" fill="${colors[image.dataset.src]}"/></svg>`)
            observer.unobserve(image)
          }
        },
        { rootMargin: '0px' },
      )
      document.querySelectorAll('img[data-src]').forEach(image => observer.observe(image))
    </script>
  </body>
</html>
