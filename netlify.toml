# Netlify 配置。文档: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# 站点是 website/ 里的 Next.js 应用。改这个文件前先读 website/README.md 的「部署」和 AGENTS.md 的「联动一致性」；
# 标了「联动」的几处由 scripts/check-consistency.mjs 核对。

[build]
  # 联动：必须是含 next 依赖的应用目录。Netlify 只在 base 里装依赖、读 .node-version，插件也从 base 的
  # node_modules 里找（见下面的 [[plugins]]）。base 留在仓库根目录，插件就不在那里，Netlify 会另装一份
  # 它自己选的旧版 v4（面向 Next 13.5 之前），Next 16 在它打包函数的那一步失败。
  base = "website"
  command = "npm run build"
  # 相对 base；Next.js 运行时只认 .next。
  publish = ".next"

  # 联动：ignore 在 base 目录里运行，路径要用 :/ 从仓库根起算。写成 `-- website` 会变成 website/website，
  # 永远没有差异，等于永远跳过构建。netlify.toml 本身也算在内，否则只改配置不会部署。
  # 退出码 0 表示跳过构建，非 0 才继续；还没有成功的部署（CACHED_COMMIT_REF 为空）时直接构建。
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':/website' ':/netlify.toml'"

[build.environment]
  # 联动：与仓库根的 .node-version 一致。base 不是仓库根，Netlify 在 website/ 里找不到那份文件，所以这里要写一份。
  NODE_VERSION = "24"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# 联动：目标文件在 website/public/，website/proxy.ts 的 matcher 也要放过这两条路径（不加语言前缀）。
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service.html"
  status = 200

[[redirects]]
  from = "/terms-of-service/"
  to = "/terms-of-service.html"
  status = 200

# 联动：Next.js 运行时在这里声明，版本固定在 website/package.json（进 lockfile，由 Dependabot 月度升级）。
# Netlify 只自动加载装在站点设置里的运行时，这个站点没有：不声明，构建里就没有运行时，部署出去的只是 .next 目录。
# 装在 package.json 里的插件被直接使用，不再经过 Netlify 的版本钉住与兼容规则；只声明、不固定，
# Netlify 会自己装一份旧版 v4。
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 非生产上下文不做自动部署；这里保留显式兜底，避免 UI 设置被误打开后跑构建。
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
