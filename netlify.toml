# Netlify 配置。文档: https://docs.netlify.com/build/configure-builds/file-based-configuration/
#
# 站点是 website/ 里的 Next.js 应用。改这个文件前先读 website/README.md 的「部署」和 AGENTS.md 的「联动一致性」；
# 标了「联动」的几处由 scripts/check-consistency.mjs 核对。

[build]
  # 联动：必须是含 next 依赖的应用目录。Netlify 只在 base 里装依赖、读 .node-version，插件也从 base 的
  # node_modules 里找（见下面的 [[plugins]]）。base 留在仓库根目录，插件就不在那里，Netlify 会另装一份
  # 它自己选的旧版 v4（面向 Next 13.5 之前），Next 16 在它打包函数的那一步失败。
  base = "website"
  command = "npm run build"
  # 相对 base；Next.js 运行时只认 .next。
  publish = ".next"

  # 联动：ignore 在 base 目录里运行，路径要用 :/ 从仓库根起算。写成 `-- website` 会变成 website/website，
  # 永远没有差异，等于永远跳过构建。netlify.toml 本身也算在内，否则只改配置不会部署。
  # 退出码 0 表示跳过构建，非 0 才继续，所以每一步都往“构建”的方向失败。只有上一次构建的提交确实是
  # COMMIT_REF 的祖先、且监视的路径没有差异，才跳过。下面三种情形一律构建：
  #   - CACHED_COMMIT_REF 为空，或等于 COMMIT_REF。Netlify 文档写明没有缓存的构建里两者相等，diff 恒为空，
  #     不排除就会把没有缓存的构建当成“无变化”；
  #   - CACHED_COMMIT_REF 不是 COMMIT_REF 的祖先，例如 PR 预览的头提交：rebase 或 squash 合并后它不在 main 的历史里，
  #     内容却和合并结果完全相同；
  #   - 取不到 CACHED_COMMIT_REF 对应的提交，git 报错。
  # 前两种情形都会让旧写法把 #64 合并后的生产部署取消（Netlify 对任何 ignore 取消都报“Canceled build due to no
  # content change”，所以报错信息分辨不出原因）。netlify-ignore.test.ts 用真实的 git 仓库执行这条命令。
  ignore = "test -n \"$CACHED_COMMIT_REF\" && test \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" && git merge-base --is-ancestor \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':/website' ':/netlify.toml'"

[build.environment]
  # 联动：与仓库根的 .node-version 一致。base 不是仓库根，Netlify 在 website/ 里找不到那份文件，所以这里要写一份。
  NODE_VERSION = "24"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# 联动：目标文件在 website/public/，website/proxy.ts 的 matcher 也要放过这两条路径（不加语言前缀）。
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service.html"
  status = 200

[[redirects]]
  from = "/terms-of-service/"
  to = "/terms-of-service.html"
  status = 200

# 联动：Next.js 运行时在这里声明，版本固定在 website/package.json（进 lockfile，由 Dependabot 月度升级）。
# Netlify 只自动加载装在站点设置里的运行时，这个站点没有：不声明，构建里就没有运行时，部署出去的只是 .next 目录。
# 装在 package.json 里的插件被直接使用，不再经过 Netlify 的版本钉住与兼容规则；只声明、不固定，
# Netlify 会自己装一份旧版 v4。
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 联动：website/ 读取的每个 NEXT_PUBLIC_ 变量都在这里同名声明。Next.js 构建时把它们写进页面，名字对不上就是静默关闭。
# 上下文的变量按名字并入 [build.environment]（Netlify 的配置解析用 deepmerge），NODE_VERSION 照样生效。
[context.production.environment]
  # Cloudflare Web Analytics 的站点令牌，公开值（页面里本来就带着它）。只给生产构建，本地构建和预览不统计。
  # 留空就不加载统计脚本，也不显示同意卡片和「统计设置」。Cloudflare 侧的设置见 website/README.md 的「访问统计」。
  NEXT_PUBLIC_CF_BEACON_TOKEN = "2691b0253f3540ac8ac79f4b41b7bf02"

# 非生产上下文不做自动部署；这里保留显式兜底，避免 UI 设置被误打开后跑构建。
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"
