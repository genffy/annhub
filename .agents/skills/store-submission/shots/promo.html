<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AnnHub promo tiles</title>
    <style>
      :root {
        --canvas: #f4f2fa;
        --ink: #1f2937;
        --muted: #6b7280;
        --accent: #7c3aed;
        --line: #e5e7eb;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #fff; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .board { position: relative; overflow: hidden; background: var(--canvas); }
      .wordmark { font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
      .wordmark .dot { color: var(--accent); }
      .shot { object-fit: cover; object-position: top; display: block; border: 1px solid var(--line); }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 24px rgba(31, 41, 55, 0.10); overflow: hidden; }

      /* a crop of a 1280 x 800 shot: the image is scaled by its width and moved so the part that sells shows */
      .crop { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .crop img { position: absolute; max-width: none; display: block; }

      /* ── small promo tile · 440 x 280 ─────────────────────────────── */
      #small { width: 440px; height: 280px; padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 12px; }
      #small .top { display: flex; align-items: baseline; justify-content: space-between; }
      #small .wordmark { font-size: 26px; }
      #small .tagline { font-size: 12px; color: var(--muted); }
      #small .card { flex: 1; }
      #small .crop img { width: 640px; left: 0; top: -102px; }

      /* ── marquee promo tile · 1400 x 560 ─────────────────────────── */
      #marquee { width: 1400px; height: 560px; padding: 64px 72px; display: flex; align-items: center; gap: 64px; }
      #marquee .copy { width: 560px; display: flex; flex-direction: column; gap: 20px; }
      #marquee .wordmark { font-size: 64px; }
      #marquee .lead { font-size: 27px; line-height: 1.4; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
      #marquee .chips { display: flex; gap: 10px; margin-top: 6px; }
      #marquee .chip { font-size: 15px; color: var(--accent); background: rgba(124, 58, 237, 0.08); border: 1px solid rgba(124, 58, 237, 0.25); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
      #marquee .stage { position: relative; flex: 1; height: 100%; }
      #marquee .card.main { position: absolute; right: 0; top: 0; width: 584px; }
      #marquee .card.main .shot { width: 584px; height: 366px; }
      #marquee .card.sub { position: absolute; left: 0; bottom: 0; width: 344px; height: 212px; box-shadow: 0 14px 30px rgba(31, 41, 55, 0.16); }
      #marquee .card.sub .crop img { width: 600px; left: 0; top: -92px; }
    </style>
  </head>
  <body>
    <div class="board" id="small">
      <div class="top">
        <div class="wordmark">AnnHub<span class="dot">.</span></div>
        <div class="tagline">Clip &middot; Screenshot &middot; Annotate &middot; Record &middot; Download</div>
      </div>
      <div class="card"><div class="crop"><img src="en/03-page-annotation.png" alt="" /></div></div>
    </div>

    <div class="board" id="marquee">
      <div class="copy">
        <div class="wordmark">AnnHub<span class="dot">.</span></div>
        <div class="lead">Keep what&rsquo;s worth keeping from the web in one local library.</div>
        <div class="chips">
          <span class="chip">Local-first</span>
          <span class="chip">Annotate &amp; record</span>
          <span class="chip">Download as Markdown</span>
        </div>
      </div>
      <div class="stage">
        <div class="card main"><img class="shot" src="en/05-download.png" alt="" /></div>
        <div class="card sub"><div class="crop"><img src="en/03-page-annotation.png" alt="" /></div></div>
      </div>
    </div>
  </body>
</html>
