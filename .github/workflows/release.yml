name: Release Extension

# Tag `v<package.json version>` to publish. The tagged commit must pass the full CI gate,
# and the published zip carries a build-provenance attestation:
#   gh attestation verify <zip> --repo genffy/annhub
on:
  push:
    tags:
      - 'v*' # e.g. v2.0.0

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: verify
    uses: ./.github/workflows/build-extension.yml
    permissions:
      artifact-metadata: write
      contents: read

  release:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./release-assets

      - name: Verify the asset against the tag
        env:
          ZIP_PATH: ./release-assets/${{ needs.build.outputs.zip-name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "$ZIP_PATH"
          version="$(unzip -p "$ZIP_PATH" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ "v${version}" != "$TAG_NAME" ]; then
            echo "Tag ${TAG_NAME} does not match the extension version ${version}." >&2
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ./release-assets/${{ needs.build.outputs.zip-name }}

      - name: Create the release and upload the asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ZIP_PATH: ./release-assets/${{ needs.build.outputs.zip-name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ZIP_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$ZIP_PATH" --title "Release ${TAG_NAME}" --generate-notes --verify-tag
          fi
