name: Scheduled Audit

# Advisories appear after a dependency is merged. A weekly run catches them without making
# unrelated pull requests fail; Dependabot security updates open the fix.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: pnpm audit (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        directory: [., website]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Reads the lockfile; nothing is installed.
      - name: Audit runtime dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm audit --prod --audit-level high
