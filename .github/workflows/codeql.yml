name: CodeQL

# Static analysis for the TypeScript extension, the Swift app and the workflows themselves.
# Findings land in the Security tab and block the merge through the `CodeQL` status check.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 4 * * 1' # weekly, so new queries also run against unchanged code

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
          - language: swift
            runner: macos-26
            build-mode: manual
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Swift needs a build to extract. Autobuild would try to code-sign; build the app the
      # same way CI does, and only the Desktop target.
      - name: Set up XcodeGen
        if: matrix.language == 'swift'
        uses: ./.github/actions/setup-xcodegen

      - name: Build Desktop for analysis
        if: matrix.language == 'swift'
        working-directory: app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build \
            -project AnnHub.xcodeproj \
            -scheme AnnHubDesktop \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
