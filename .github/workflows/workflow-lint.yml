name: Workflow Lint

# actionlint checks syntax, expressions and shell; zizmor checks security (unpinned actions,
# template injection, excessive permissions, credential persistence).
#
# Both are required checks (.github/rulesets/main.json). A required check from a workflow that a
# path filter skips stays pending and blocks the pull request, so pull requests are linted whether
# or not they touch .github; only the run after a merge to main is limited to workflow changes.
# `npm run check:consistency` fails when a workflow that reports a required check filters pull_request.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/**'
  merge_group:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Report as annotations and fail the job; no SARIF upload, so fork PRs work too.
          advanced-security: false
