name: Workflow Lint

# actionlint checks syntax, expressions and shell; zizmor checks security (unpinned actions,
# template injection, excessive permissions, credential persistence).
#
# Both are required checks (.github/rulesets/main.json). A required check from a workflow that a
# path filter skips stays pending and blocks the pull request, so pull requests are linted whether
# or not they touch .github; only the run after a merge to main is limited to workflow changes.
# `npm run check:consistency` fails when a workflow that reports a required check filters pull_request.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/**'
  merge_group:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The prebuilt release binary instead of `go run`, which compiles actionlint from source
      # on every run. The checksum comes from the release and must match the tarball.
      - name: Download the actionlint release binary
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          version="${ACTIONLINT_VERSION#v}"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$dir/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${version}_checksums.txt" \
            --output "$dir/checksums.txt"
          grep "actionlint_${version}_linux_amd64.tar.gz" "$dir/checksums.txt" | sha256sum --check --status
          tar --extract --gzip --file "$dir/actionlint.tar.gz" --directory "$dir" actionlint
          "$dir/actionlint" --version

      - name: Run actionlint
        run: $RUNNER_TEMP/actionlint/actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Report as annotations and fail the job; no SARIF upload, so fork PRs work too.
          advanced-security: false
