name: CI

# The merge gate. Every job runs on pull requests, on pushes to main and in the merge queue;
# `ci-pass` is the single status that branch protection requires.
#
# There is deliberately no path filter. Some tests read files outside their own directory
# (utils/__tests__/legal-pages.test.ts reads website/public/*.html), so a list of paths that
# "cannot affect" a job is one more hidden coupling, and it would skip a test that should fail.
# Cut the number of runs instead: Dependabot is monthly and grouped (.github/dependabot.yml),
# and a new push cancels the run it supersedes (concurrency below).
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extension:
    name: Extension (format, lint, types, unit, build, E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Documentation links
        run: npm run check:docs

      - name: Lockfiles use the public registry
        run: npm run check:lockfiles

      - name: Related settings agree (Node.js, Next.js, Netlify, package directories)
        run: npm run check:consistency

      - name: Build
        run: npm run build

      - name: Verify the extension package
        run: |
          set -euo pipefail
          test -f .output/chrome-mv3/manifest.json
          node -e "const m=require('./.output/chrome-mv3/manifest.json'); if(m.manifest_version!==3) throw new Error('not MV3'); console.log(m.name, m.version)"

      - name: Install the browser for E2E
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  website:
    name: Website (types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ci-pass:
    name: ci-pass
    if: always()
    needs: [extension, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
