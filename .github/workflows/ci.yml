name: CI

# The merge gate. Every job runs on pull requests, on pushes to main and in the merge queue;
# `ci-pass` is the single status that branch protection requires.
#
# There is deliberately no trigger-level path filter: a workflow a filter skips never reports its
# required check, and the check would stay pending and block the merge (check-consistency enforces
# this). Instead the jobs classify the pull request's changed files at runtime
# (.github/actions/docs-only): when only markdown or docs changed, the browser tests and the
# website build exit immediately and `static` keeps the doc checks; pushes to main and the merge
# queue always run everything. The unit tests are never skipped: they are what keeps the docs and
# the code in step (tests/website/token-parity.test.ts reads docs/design/css/tokens.css,
# tests/website/website.test.ts reads both READMEs and docs/product/permissions.md), so a docs-only
# pull request can break them (check-consistency enforces this too).
#
# The jobs are independent so the wall time is the slowest part, not the sum: static checks, unit
# tests, the website build and the E2E shards run in parallel. E2E shards work because every test
# launches its own browser profile (e2e/fixtures.ts), so a shard is one more machine running
# workers=1.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static (format, lint, types, docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify docs-only pull requests
        id: docs
        uses: ./.github/actions/docs-only

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The consistency checks inspect both installed toolchains.
      - name: Install website dependencies
        if: steps.docs.outputs.docs-only != 'true'
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run lint

      - name: Type check
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run compile

      - name: Documentation (links, section references, wording)
        run: pnpm run check:docs
      - name: File size budgets
        run: pnpm run check:size

      - name: Lockfiles use the public registry
        run: pnpm run check:lockfiles

      - name: Related settings agree (Node.js, Next.js, Cloudflare, package directories)
        run: pnpm run check:consistency

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No docs-only shortcut here: see the note at the top of this file.
      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_SHARD: ${{ matrix.shard }}
      PLAYWRIGHT_TOTAL_SHARDS: '4'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify docs-only pull requests
        id: docs
        uses: ./.github/actions/docs-only

      - name: Docs-only pull request
        if: steps.docs.outputs.docs-only == 'true'
        run: echo "Only markdown or docs changed; no browser behavior can be affected."

      - name: Set up pnpm
        if: steps.docs.outputs.docs-only != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run build

      - name: Verify the extension package
        if: steps.docs.outputs.docs-only != 'true'
        run: |
          set -euo pipefail
          test -f .output/chrome-mv3/manifest.json
          node -e "const m=require('./.output/chrome-mv3/manifest.json'); if(m.manifest_version!==3) throw new Error('not MV3'); console.log(m.name, m.version)"

      # The bundle budgets need this job's build; verify has none (RV-TEST-10).
      - name: Bundle size budgets
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run check:bundle

      - name: Cache the E2E browser
        if: steps.docs.outputs.docs-only != 'true'
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the browser for E2E
        if: steps.docs.outputs.docs-only != 'true' && steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The cache restores the browser binaries; system libraries ship with the runner image.
      # A no-op install still verifies the cache is complete.
      - name: Reuse the cached browser
        if: steps.docs.outputs.docs-only != 'true' && steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      - name: E2E
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm exec playwright test --shard="$PLAYWRIGHT_SHARD/$PLAYWRIGHT_TOTAL_SHARDS"

      - name: Keep the blob report for merging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  website:
    name: Website (types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify docs-only pull requests
        id: docs
        uses: ./.github/actions/docs-only

      - name: Docs-only pull request
        if: steps.docs.outputs.docs-only == 'true'
        run: echo "Only markdown or docs changed; the website cannot be affected."

      - name: Set up pnpm
        if: steps.docs.outputs.docs-only != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        if: steps.docs.outputs.docs-only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Type check
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run typecheck

      - name: Lint
        if: steps.docs.outputs.docs-only != 'true'
        run: pnpm run lint

      - name: Build
        if: steps.docs.outputs.docs-only != 'true'
        env:
          BUILD_PRODUCTION: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$BUILD_PRODUCTION" = true ]; then
            pnpm run build --production
          else
            pnpm run build
          fi

      - name: Verify the actual static routes
        if: steps.docs.outputs.docs-only != 'true'
        env:
          WEBSITE_SMOKE_ORIGIN: http://localhost:3001
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          pnpm run start > "$RUNNER_TEMP/website-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            echo "Waiting for the static preview ($attempt/30)"
            if curl --fail --silent "$WEBSITE_SMOKE_ORIGIN/__deployment.json" > /dev/null; then
              node ../scripts/smoke-website.mjs --local
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/website-preview.log"
          exit 1

      - name: Keep the production website for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-static-${{ github.sha }}
          path: website/out/
          retention-days: 1
          if-no-files-found: error

  merge-reports:
    name: Merge E2E reports
    needs: [e2e]
    if: needs.e2e.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the shard blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blob-reports

      - name: Merge into one HTML report
        run: pnpm exec playwright merge-reports --reporter html ./blob-reports

      - name: Keep the Playwright report on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  ci-pass:
    name: ci-pass
    if: always()
    needs: [static, unit, e2e, website]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi

  deploy-website:
    name: Deploy website
    needs: [ci-pass, website]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: website-production
    permissions:
      contents: read
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Skip a commit superseded on main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; keeping its place in the deployment queue."
          fi

      - name: Download the artifact from this run
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-static-${{ github.sha }}
          path: website/out/

      - name: Verify the artifact and deployment settings
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ZONE_ID"
          node scripts/check-website-export.mjs
          node -e 'const v=require("./website/package.json").devDependencies.wrangler; if(!/^\d+\.\d+\.\d+$/.test(v)) throw new Error("Pin the Wrangler version"); require("node:fs").appendFileSync(process.env.GITHUB_ENV, "WRANGLER_VERSION="+v+"\n")'

      - name: Apply the website edge rules
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/cloudflare-rules.mjs --apply

      - name: Deploy the verified static files
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx "wrangler@$WRANGLER_VERSION" deploy --config website/wrangler.json

      - name: Verify the production routes and revision
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/smoke-website.mjs
