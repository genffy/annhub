version: 2

# Every Dependabot pull request runs the whole merge gate, a macOS build among it, so the number of
# pull requests is what costs. Four things keep it small:
#   - Monthly, not weekly. Security updates are not on this schedule: they arrive when an advisory
#     is published.
#   - At most 3 open version-update pull requests per directory. Security updates do not count.
#   - One group per directory, for minor and patch updates only. Majors are not grouped: a group that
#     took in eslint and typescript replaced their two individual pull requests with one that read
#     like routine maintenance, and it was merged with a red build. A major stays an individual pull
#     request, with its own title and its own red check.
#   - A cooldown keeps brand-new releases out for a week, which is when most compromised packages
#     are noticed and pulled. Security updates ignore the cooldown.
#
# A major pull request is where a migration starts: push the follow-up changes onto its branch,
# following AGENTS.md「联动一致性」, or close it. Do not merge one while it is red.
#
# `ignore` also applies to security updates, so it is used only for build tooling without runtime
# exposure whose next major needs a migration this project has not done. Each entry says what that is;
# delete the entry when the migration is done.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # The type definitions follow the runtime in `.node-version` (`npm run check:consistency` enforces
      # it), so a new major is raised together with the Node.js version, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Tailwind CSS 4 moves the PostCSS plugin into @tailwindcss/postcss and the configuration into CSS:
      # a migration that needs a visual comparison. `npm run check:consistency` catches a bump without it.
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      # typescript-eslint supports TypeScript only below 6.1, and with TypeScript 7 `npm run lint` fails.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-config-next 16 bundles plugins (import, jsx-a11y, react) whose peer ranges stop at ESLint 9.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-xcodegen
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
